name: Validate Publication Signing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-publication-signing
  cancel-in-progress: false

jobs:
  signing:
    name: Publication signing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: sdk-publication
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: public mainからだけ検証
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Publication signingの検証はpublic mainからだけ実行できます。" >&2
            exit 1
          fi
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: Android SDKを準備
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic
      - name: Maven Centralへ送信せず全publicationを署名
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: >-
          ./gradlew
          :protocol:signMavenPublication
          :runtime-core:signMavenPublication
          :runtime-preferences:signMavenPublication
          :runtime-shared-preferences:signMavenPublication
          :runtime-protobuf:signMavenPublication
          -PsignAllPublications=true
          --no-configuration-cache
          --console=plain
