name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: whitespace・conflict markerを検出
        if: github.event_name == 'pull_request'
        run: git diff --check ${{ github.event.pull_request.base.sha }} HEAD

  public-source:
    name: Public source gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 公開予定treeの境界を検証
        run: ./scripts/verify-public-source.sh
      - name: tracked treeと履歴のsecretを検査
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: "8.29.1"

  sdk:
    name: SDK release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: Android SDKを準備
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic
      - name: Runtime、sample、APK／AAB分離を検証
        run: ./gradlew checkSdk --console=plain
      - name: 検証記録を保存
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sdk-release-reports
          path: |
            **/build/reports/
            protocol/build/libs/
            runtime-core/build/outputs/aar/
            runtime-preferences/build/outputs/aar/
            runtime-shared-preferences/build/outputs/aar/
            runtime-protobuf/build/outputs/aar/
            build/publication-repository/**/*.pom
            build/publication-repository/**/*.module
            sample-app/build/outputs/apk/release/
            sample-app/build/outputs/bundle/release/

  gradle-plugin:
    name: Gradle Plugin release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic
      - name: Gradle Pluginを専用Wrapperで検証
        run: ./gradle-plugin/gradlew -p gradle-plugin clean checkPlugin --console=plain
      - name: 検証記録を保存
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gradle-plugin-release-reports
          path: |
            gradle-plugin/build/reports/
            gradle-plugin/build/libs/
