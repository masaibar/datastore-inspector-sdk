name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy_gates: ${{ steps.classify.outputs.heavy }}
      classification_reason: ${{ steps.classify.outputs.reason }}
      changed_count: ${{ steps.classify.outputs.changed_count }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: whitespace・conflict markerを検出
        if: github.event_name == 'pull_request'
        run: git diff --check ${{ github.event.pull_request.base.sha }} HEAD
      - name: CI変更分類を検証
        run: ./scripts/test-classify-ci-changes.sh
      - name: 重いrelease gateの要否を判定
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          classification_args=()

          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
              ;;
            push)
              base_sha="$PUSH_BASE_SHA"
              head_sha="$CURRENT_SHA"
              ;;
            *)
              classification_args+=(--force-full)
              ;;
          esac

          if [[ ${#classification_args[@]} -eq 0 ]]; then
            if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]] ||
              ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null ||
              ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
              classification_args+=(--force-full)
            else
              changed_paths_file="$RUNNER_TEMP/ci-changed-paths"
              git diff --name-only -z "$base_sha" "$head_sha" > "$changed_paths_file"
              while IFS= read -r -d '' changed_path; do
                classification_args+=(--path "$changed_path")
              done < "$changed_paths_file"
            fi
          fi

          classification="$(./scripts/classify-ci-changes.sh "${classification_args[@]}")"
          printf '%s\n' "$classification"
          printf '%s\n' "$classification" >> "$GITHUB_OUTPUT"

  public-source:
    name: Public source gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 公開予定treeの境界を検証
        run: ./scripts/verify-public-source.sh
      - name: tracked treeと履歴のsecretを検査
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: "8.29.1"

  sdk:
    name: SDK release gate
    needs: quality
    if: needs.quality.outputs.heavy_gates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: Android SDKを準備
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic
      - name: Runtime、sample、APK／AAB分離を検証
        run: ./gradlew checkSdk --console=plain
      - name: JDK 17を準備
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: 公開artifactをJDK 17 consumerで検証
        shell: bash
        run: |
          publication_group="$(sed -n 's/^group=//p' gradle/artifact-coordinates.properties)"
          publication_version="$(sed -n 's/^version=//p' gradle/artifact-coordinates.properties)"
          ./gradlew -p gradle/publication-consumer clean verifyJdk17Consumer \
            -PpublicationRepository="$GITHUB_WORKSPACE/build/publication-repository" \
            -PpublicationGroup="$publication_group" \
            -PpublicationVersion="$publication_version" \
            --no-configuration-cache \
            --console=plain
      - name: 検証記録を保存
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sdk-release-reports
          path: |
            **/build/reports/
            protocol/build/libs/
            runtime-core/build/outputs/aar/
            runtime-preferences/build/outputs/aar/
            runtime-shared-preferences/build/outputs/aar/
            runtime-protobuf/build/outputs/aar/
            build/publication-repository/**/*.pom
            build/publication-repository/**/*.module
            sample-app/build/outputs/apk/release/
            sample-app/build/outputs/bundle/release/

  gradle-plugin:
    name: Gradle Plugin release gate
    needs: quality
    if: needs.quality.outputs.heavy_gates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic
      - name: Gradle Pluginを専用Wrapperで検証
        run: ./gradle-plugin/gradlew -p gradle-plugin clean checkPlugin --console=plain
      - name: 検証記録を保存
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gradle-plugin-release-reports
          path: |
            gradle-plugin/build/reports/
            gradle-plugin/build/libs/
