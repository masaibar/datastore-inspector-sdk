name: Publish SDK

on:
  workflow_call:
    inputs:
      version:
        description: Release version matching the artifact coordinates
        required: true
        type: string
      release-commit:
        description: Exact merge commit to publish
        required: true
        type: string
      target:
        description: Publication destination
        default: all
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release version matching gradle/artifact-coordinates.properties
        required: true
        type: string
      target:
        description: Use a single target to retry a partial failure; all publishes both targets
        required: true
        default: all
        type: choice
        options:
          - all
          - maven-central
          - plugin-portal

permissions:
  contents: read

concurrency:
  group: publish-sdk
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare v${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release-commit || github.sha }}
          fetch-depth: 0
      - name: Prepare the release tag and GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.release-commit }}
          PUBLICATION_TARGET: ${{ inputs.target }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Publication must run from public main." >&2
            exit 1
          fi
          case "$PUBLICATION_TARGET" in
            all | maven-central | plugin-portal) ;;
            *) echo "Unknown publication target: $PUBLICATION_TARGET" >&2; exit 1 ;;
          esac
          expected_tag="v${REQUESTED_VERSION}"
          release_commit="${RELEASE_COMMIT:-$GITHUB_SHA}"
          if [[ -z "$RELEASE_COMMIT" ]] && git show-ref --verify --quiet "refs/tags/${expected_tag}"; then
            release_commit="$(git rev-list -n 1 "$expected_tag")"
            git checkout --detach "$release_commit"
          fi
          ./scripts/ensure-github-release.sh \
            --version "$REQUESTED_VERSION" \
            --commit "$release_commit" \
            --repository "$GITHUB_REPOSITORY"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ inputs.version }}
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: sdk-publication
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release version and tag
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          expected_tag="v${REQUESTED_VERSION}"
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Publication must run from public main." >&2
            exit 1
          fi
          configured_version="$(sed -n 's/^version=//p' gradle/artifact-coordinates.properties)"
          if [[ "$configured_version" != "$REQUESTED_VERSION" ]]; then
            echo "The requested version does not match the artifact coordinates." >&2
            exit 1
          fi
          if [[ "$configured_version" == *-SNAPSHOT ]]; then
            echo "SNAPSHOT versions cannot be published by the release workflow." >&2
            exit 1
          fi
          if [[ ! "$configured_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "The release version must use SemVer." >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$expected_tag")"
          checked_out_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$checked_out_commit" ]]; then
            echo "The release tag does not match the checked out commit." >&2
            exit 1
          fi
      - name: 公開予定treeの境界を検証
        run: ./scripts/verify-public-source.sh
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: Android SDKを準備
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic
      - name: SDK release gateを検証
        run: ./gradlew checkSdk --console=plain
      - name: JDK 17を準備
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: 公開artifactをJDK 17 consumerで検証
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          publication_group="$(sed -n 's/^group=//p' gradle/artifact-coordinates.properties)"
          ./gradlew -p gradle/publication-consumer clean verifyJdk17Consumer \
            -PpublicationRepository="$GITHUB_WORKSPACE/build/publication-repository" \
            -PpublicationGroup="$publication_group" \
            -PpublicationVersion="$REQUESTED_VERSION" \
            --no-configuration-cache \
            --console=plain
      - name: JDK 21へ戻す
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Plugin Portal metadataを検証
        if: inputs.target == 'all' || inputs.target == 'plugin-portal'
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradle-plugin/gradlew -p gradle-plugin publishPlugins --validate-only --console=plain
      - name: Maven Centralへpublishして自動release
        if: inputs.target == 'all' || inputs.target == 'maven-central'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: >-
          ./gradlew publishAndReleaseToMavenCentral
          -PmavenCentralPublishing=true
          -PmavenCentralAutomaticPublishing=true
          -PmavenCentralDeploymentValidation=PUBLISHED
          -PsignAllPublications=true
          --no-configuration-cache
          --console=plain
      - name: Gradle Plugin Portalへpublish
        if: inputs.target == 'all' || inputs.target == 'plugin-portal'
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradle-plugin/gradlew -p gradle-plugin publishPlugins --console=plain
