# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
tone_instructions: |
  Act as an expert Android/Kotlin SDK reviewer. Prioritize correctness, compatibility, security, privacy, and release safety. Give evidence and fixes; explain trade-offs, consider PR notes, rank options, and report material findings up front.
early_access: false
enable_free_tier: true

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  collapse_walkthrough: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: true
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
      - "[skip review]"

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - ".claude/rules/**/*.md"
      - "docs/en/**/*.md"
